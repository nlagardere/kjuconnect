<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mes Notes</title>
<link rel="stylesheet" href="style.css">
<style>
  .page { padding: 20px; }

  /* Add note area */
  .add-area {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 18px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    animation: fadeUp 0.4s var(--ease) both;
  }

  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .add-row .input {
    flex: 1;
    padding: 11px 14px;
    font-size: 14px;
    border-radius: var(--radius);
  }

  .add-row .btn-add {
    width: 44px; height: 44px;
    border-radius: var(--radius);
    padding: 0;
    flex-shrink: 0;
    font-size: 20px;
  }

  .add-area textarea.input {
    min-height: 80px;
    font-size: 14px;
    margin-bottom: 10px;
  }

  .add-area .input::placeholder { color: var(--dim); font-size: 13px; }

  /* Color picker */
  .color-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .color-row .label {
    font-size: 11px;
    font-weight: 600;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-right: 4px;
  }

  .color-dot {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: 0.2s ease;
  }
  .color-dot:active { transform: scale(0.85); }
  .color-dot.selected { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg); }

  /* Notes list */
  .notes-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .note-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    position: relative;
    animation: fadeUp 0.35s var(--ease) both;
    transition: 0.2s ease;
  }

  .note-card:active {
    transform: scale(0.985);
  }

  .note-card .note-accent {
    position: absolute;
    top: 12px; left: 0;
    width: 4px;
    height: calc(100% - 24px);
    border-radius: 0 3px 3px 0;
  }

  .note-card .note-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
    padding-left: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .note-card .note-body {
    font-size: 13px;
    color: var(--sub);
    line-height: 1.55;
    padding-left: 10px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 80px;
    overflow: hidden;
    position: relative;
  }

  .note-card .note-body.truncated::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 30px;
    background: linear-gradient(transparent, var(--card));
  }

  .note-card .note-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding-left: 10px;
  }

  .note-card .note-date {
    font-size: 11px;
    color: var(--dim);
    font-weight: 500;
  }

  .note-card .note-pin {
    font-size: 12px;
  }

  .note-card .note-actions {
    margin-left: auto;
    display: flex;
    gap: 4px;
  }

  .note-card .note-actions button {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    transition: 0.2s ease;
  }
  .note-card .note-actions button:active {
    background: rgba(0,0,0,0.05);
    transform: scale(0.9);
  }

  .note-card.pinned {
    border-color: rgba(245,158,11,0.2);
    background: linear-gradient(135deg, var(--card), rgba(245,158,11,0.03));
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
  }
  .empty-state .empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.4;
  }
  .empty-state .empty-text {
    font-size: 15px;
    color: var(--sub);
    font-weight: 500;
  }
  .empty-state .empty-hint {
    font-size: 13px;
    color: var(--dim);
    margin-top: 6px;
  }

  /* Note detail modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 40;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    width: 100%;
    max-width: 500px;
    max-height: 85vh;
    background: var(--card);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    padding: 24px 20px 40px;
    overflow-y: auto;
    animation: slideUp 0.3s var(--ease);
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }

  .modal-handle {
    width: 36px; height: 4px;
    background: rgba(0,0,0,0.1);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .modal-title-input {
    width: 100%;
    padding: 0;
    border: none;
    background: transparent;
    font-family: var(--font);
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
    outline: none;
    margin-bottom: 12px;
  }

  .modal-body-input {
    width: 100%;
    padding: 0;
    border: none;
    background: transparent;
    font-family: var(--font);
    font-size: 15px;
    color: var(--text-mid);
    outline: none;
    resize: none;
    min-height: 160px;
    line-height: 1.65;
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">Mes Notes</span>
  <a class="topbar-settings" href="settings.html">⚙</a>
</div>

<div class="page">
  <!-- Add note -->
  <div class="add-area">
    <div class="add-row">
      <input type="text" class="input" id="noteTitle" placeholder="Titre de la note…">
      <button class="btn btn-add" id="addBtn" onclick="addNote()">+</button>
    </div>
    <textarea class="input" id="noteBody" placeholder="Écris ta note ici…"></textarea>
    <div class="color-row">
      <span class="label">Couleur</span>
      <div class="color-dot selected" style="background:#e85d3a" data-color="#e85d3a" onclick="pickColor(this)"></div>
      <div class="color-dot" style="background:#3b82f6" data-color="#3b82f6" onclick="pickColor(this)"></div>
      <div class="color-dot" style="background:#22c55e" data-color="#22c55e" onclick="pickColor(this)"></div>
      <div class="color-dot" style="background:#f59e0b" data-color="#f59e0b" onclick="pickColor(this)"></div>
      <div class="color-dot" style="background:#a855f7" data-color="#a855f7" onclick="pickColor(this)"></div>
      <div class="color-dot" style="background:#ec4899" data-color="#ec4899" onclick="pickColor(this)"></div>
    </div>
  </div>

  <!-- Notes list -->
  <div class="notes-list" id="notesList"></div>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <input type="text" class="modal-title-input" id="modalTitle" placeholder="Titre…">
    <textarea class="modal-body-input" id="modalBody" placeholder="Contenu…"></textarea>
    <div class="color-row mb-20">
      <span class="label">Couleur</span>
      <div class="color-dot" style="background:#e85d3a" data-color="#e85d3a" onclick="pickModalColor(this)"></div>
      <div class="color-dot" style="background:#3b82f6" data-color="#3b82f6" onclick="pickModalColor(this)"></div>
      <div class="color-dot" style="background:#22c55e" data-color="#22c55e" onclick="pickModalColor(this)"></div>
      <div class="color-dot" style="background:#f59e0b" data-color="#f59e0b" onclick="pickModalColor(this)"></div>
      <div class="color-dot" style="background:#a855f7" data-color="#a855f7" onclick="pickModalColor(this)"></div>
      <div class="color-dot" style="background:#ec4899" data-color="#ec4899" onclick="pickModalColor(this)"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-full" onclick="saveModal()">Sauvegarder</button>
      <button class="btn btn-danger" onclick="deleteModal()">Supprimer</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<div class="navbar">
  <a href="index.html"><img src="assets/badge-id.png" alt=""></a>
  <a href="gate_slots.html"><img src="assets/clock.png" alt=""></a>
  <a href="notes.html" class="active"><img src="assets/reminders.png" alt=""></a>
</div>

<script>
const NOTES_KEY = 'kju_notes';
let selectedColor = '#e85d3a';
let editingId = null;
let modalColor = '#e85d3a';

function getNotes() {
  try { return JSON.parse(localStorage.getItem(NOTES_KEY)) || []; }
  catch { return []; }
}

function saveNotes(notes) {
  localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function pickColor(el) {
  document.querySelectorAll('.add-area .color-dot').forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');
  selectedColor = el.dataset.color;
}

function pickModalColor(el) {
  document.querySelectorAll('#modal .color-dot').forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');
  modalColor = el.dataset.color;
}

function addNote() {
  const title = document.getElementById('noteTitle').value.trim();
  const body = document.getElementById('noteBody').value.trim();
  if (!title && !body) return;

  const notes = getNotes();
  notes.unshift({
    id: Date.now(),
    title: title || 'Sans titre',
    body,
    color: selectedColor,
    pinned: false,
    date: new Date().toISOString()
  });
  saveNotes(notes);
  document.getElementById('noteTitle').value = '';
  document.getElementById('noteBody').value = '';
  render();
  showToast('Note ajoutée');
}

function formatDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return "À l'instant";
  if (diff < 3600000) return `Il y a ${Math.floor(diff/60000)} min`;
  if (diff < 86400000) return `Il y a ${Math.floor(diff/3600000)}h`;
  return d.toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
}

function render() {
  const notes = getNotes();
  const list = document.getElementById('notesList');

  if (!notes.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📝</div>
        <div class="empty-text">Aucune note pour le moment</div>
        <div class="empty-hint">Écris ta première note au-dessus</div>
      </div>`;
    return;
  }

  // Sort: pinned first
  const sorted = [...notes].sort((a, b) => {
    if (a.pinned && !b.pinned) return -1;
    if (!a.pinned && b.pinned) return 1;
    return b.id - a.id;
  });

  list.innerHTML = sorted.map((n, i) => `
    <div class="note-card ${n.pinned ? 'pinned' : ''}" style="animation-delay:${i*0.03}s" onclick="openNote(${n.id})">
      <div class="note-accent" style="background:${n.color}"></div>
      <div class="note-title">${escHtml(n.title)}</div>
      ${n.body ? `<div class="note-body ${n.body.length > 120 ? 'truncated' : ''}">${escHtml(n.body)}</div>` : ''}
      <div class="note-meta">
        <span class="note-date">${formatDate(n.date)}</span>
        ${n.pinned ? '<span class="note-pin">📌</span>' : ''}
        <div class="note-actions">
          <button onclick="event.stopPropagation();togglePin(${n.id})" title="Épingler">${n.pinned ? '📌' : '📍'}</button>
          <button onclick="event.stopPropagation();deleteNote(${n.id})" title="Supprimer">🗑️</button>
        </div>
      </div>
    </div>
  `).join('');
}

function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function togglePin(id) {
  const notes = getNotes();
  const n = notes.find(x => x.id === id);
  if (n) { n.pinned = !n.pinned; saveNotes(notes); render(); }
}

function deleteNote(id) {
  saveNotes(getNotes().filter(x => x.id !== id));
  render();
  showToast('Note supprimée');
}

function openNote(id) {
  const n = getNotes().find(x => x.id === id);
  if (!n) return;
  editingId = id;
  modalColor = n.color;
  document.getElementById('modalTitle').value = n.title;
  document.getElementById('modalBody').value = n.body;
  document.querySelectorAll('#modal .color-dot').forEach(d => {
    d.classList.toggle('selected', d.dataset.color === n.color);
  });
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('show');
    editingId = null;
  }
}

function saveModal() {
  if (!editingId) return;
  const notes = getNotes();
  const n = notes.find(x => x.id === editingId);
  if (!n) return;
  n.title = document.getElementById('modalTitle').value.trim() || 'Sans titre';
  n.body = document.getElementById('modalBody').value.trim();
  n.color = modalColor;
  saveNotes(notes);
  document.getElementById('modalOverlay').classList.remove('show');
  editingId = null;
  render();
  showToast('Note modifiée');
}

function deleteModal() {
  if (!editingId) return;
  saveNotes(getNotes().filter(x => x.id !== editingId));
  document.getElementById('modalOverlay').classList.remove('show');
  editingId = null;
  render();
  showToast('Note supprimée');
}

// Enter to add
document.getElementById('noteTitle').addEventListener('keydown', e => {
  if (e.key === 'Enter') addNote();
});

render();
</script>
</body>
</html>

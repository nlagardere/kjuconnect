<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Carte Lycéen</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<style>
  .page { padding: 20px; }

  .photo-area {
    width: 100%;
    aspect-ratio: 3/4;
    max-height: 480px;
    border-radius: var(--radius-xl);
    background: var(--card);
    border: 1.5px dashed var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
    position: relative;
  }

  .photo-area .placeholder-icon {
    font-size: 48px;
    opacity: 0.3;
  }

  .photo-area .placeholder-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--dim);
    text-align: center;
    padding: 0 20px;
  }

  .photo-area img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* Tap hint */
  .tap-hint {
    text-align: center;
    margin-top: 8px;
    font-size: 12px;
    color: var(--dim);
    font-weight: 500;
    display: none;
  }

  .photo-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .photo-actions .btn { flex: 1; }

  .name-display {
    margin-top: 16px;
    text-align: center;
  }

  .name-display .name-text {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  .name-display .name-sub {
    font-size: 13px;
    color: var(--sub);
    margin-top: 4px;
  }

  #cameraInput { display: none; }

  .photo-area.has-photo {
    border-style: solid;
    border-color: rgba(34,197,94,0.2);
    cursor: pointer;
  }

  /* ── Fullscreen overlay ──────────────── */
  .fullscreen-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: #fff;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .fullscreen-overlay.show {
    display: flex;
  }

  .fullscreen-overlay img {
    max-width: 100%;
    max-height: calc(100vh - 80px);
    object-fit: contain;
    padding: 16px;
    animation: zoomIn 0.25s var(--ease);
  }

  @keyframes zoomIn {
    from { transform: scale(0.92); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .fullscreen-close {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 24px;
    border-radius: 50px;
    background: rgba(0,0,0,0.06);
    border: none;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    color: rgba(0,0,0,0.4);
    cursor: pointer;
  }

  .fullscreen-brightness {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(0,0,0,0.06);
    border: none;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <span class="topbar-title">Carte Lycéen</span>
  <a class="topbar-settings" href="settings.html">⚙</a>
</div>

<!-- Page content -->
<div class="page">
  <div class="photo-area" id="photoArea">
    <span class="placeholder-icon">🪪</span>
    <span class="placeholder-text">Prends en photo ta carte lycéen pour l'avoir toujours sur toi</span>
  </div>

  <div class="tap-hint" id="tapHint">Appuie sur la carte pour l'afficher en grand</div>

  <input type="file" accept="image/*" capture="environment" id="cameraInput">

  <div class="photo-actions" id="photoActions">
    <button class="btn" id="takePhotoBtn">📸 Prendre la photo</button>
  </div>

  <div class="photo-actions" id="photoActionsEdit" style="display:none;">
    <button class="btn btn-ghost" id="retakeBtn">🔄 Reprendre</button>
    <button class="btn btn-danger btn-sm" id="deleteBtn">Supprimer</button>
  </div>

  <div class="name-display" id="nameDisplay" style="display:none;">
    <div class="name-text" id="nameText"></div>
    <div class="name-sub">Carte lycéen sauvegardée</div>
  </div>
</div>

<!-- Fullscreen overlay -->
<div class="fullscreen-overlay" id="fullscreenOverlay">
  <img src="" id="fullscreenImg">
  <button class="fullscreen-close">Tapez n'importe où pour fermer</button>
  <button class="fullscreen-brightness" id="brightnessBtn">🔆</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Navbar -->
<div class="navbar">
  <a href="index.html" class="active"><img src="assets/badge-id.png" alt=""></a>
  <a href="gate_slots.html"><img src="assets/clock.png" alt=""></a>
  <a href="notes.html"><img src="assets/reminders.png" alt=""></a>
</div>

<script>
const STORAGE_KEY = 'carteLycéen';
const PROFILE_KEY = 'profilLycéen';
const cameraInput = document.getElementById('cameraInput');
const photoArea = document.getElementById('photoArea');
const photoActions = document.getElementById('photoActions');
const photoActionsEdit = document.getElementById('photoActionsEdit');
const nameDisplay = document.getElementById('nameDisplay');
const nameText = document.getElementById('nameText');
const tapHint = document.getElementById('tapHint');
const fullscreenOverlay = document.getElementById('fullscreenOverlay');
const fullscreenImg = document.getElementById('fullscreenImg');
const toast = document.getElementById('toast');

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

function showPhoto(src) {
  photoArea.innerHTML = `<img src="${src}">`;
  photoArea.classList.add('has-photo');
  photoActions.style.display = 'none';
  photoActionsEdit.style.display = 'flex';
  tapHint.style.display = 'block';
  const name = localStorage.getItem(PROFILE_KEY);
  nameDisplay.style.display = 'block';
  nameText.textContent = name || 'Carte sauvegardée';
}

function showPlaceholder() {
  photoArea.innerHTML = `
    <span class="placeholder-icon">🪪</span>
    <span class="placeholder-text">Prends en photo ta carte lycéen pour l'avoir toujours sur toi</span>`;
  photoArea.classList.remove('has-photo');
  photoActions.style.display = 'flex';
  photoActionsEdit.style.display = 'none';
  tapHint.style.display = 'none';
  nameDisplay.style.display = 'none';
}

// Fullscreen
function openFullscreen() {
  const src = localStorage.getItem(STORAGE_KEY);
  if (!src) return;
  fullscreenImg.src = src;
  fullscreenOverlay.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeFullscreen() {
  fullscreenOverlay.classList.remove('show');
  document.body.style.overflow = '';
  // Reset brightness
  document.body.style.filter = '';
}

photoArea.addEventListener('click', (e) => {
  if (photoArea.classList.contains('has-photo')) openFullscreen();
});

fullscreenOverlay.addEventListener('click', (e) => {
  if (e.target.closest('.fullscreen-brightness')) return;
  closeFullscreen();
});

// Brightness toggle
let bright = false;
document.getElementById('brightnessBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  bright = !bright;
  document.getElementById('brightnessBtn').textContent = bright ? '🔅' : '🔆';
  document.body.style.filter = bright ? 'brightness(1.3)' : '';
});

document.getElementById('takePhotoBtn').addEventListener('click', () => cameraInput.click());

document.getElementById('retakeBtn').addEventListener('click', () => cameraInput.click());

document.getElementById('deleteBtn').addEventListener('click', () => {
  localStorage.removeItem(STORAGE_KEY);
  showPlaceholder();
  showToast('Carte supprimée');
});

cameraInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      // High res for fullscreen display
      const max = 2048;
      let w = img.width, h = img.height;
      if (w > h && w > max) { h = h * (max / w); w = max; }
      else if (h >= w && h > max) { w = w * (max / h); h = max; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataURL = canvas.toDataURL('image/jpeg', 0.85);
      localStorage.setItem(STORAGE_KEY, dataURL);
      showPhoto(dataURL);
      showToast('Carte sauvegardée !');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  cameraInput.value = '';
});

window.addEventListener('load', () => {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) showPhoto(saved);
});
</script>
</body>
</html>
